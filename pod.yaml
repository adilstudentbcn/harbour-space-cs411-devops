apiVersion: v1
kind: Pod
metadata:
  labels:
    run: myapp
  name: myapp
spec:
  containers:
  - image: ttl.sh/adilstudentbcn:2h
    name: myapp
    ports:
    - containerPort: 4444
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    livenessProbe:
      httpGet:
        path: /
        port: 4444
      initialDelaySeconds: 3
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /
        port: 4444
      initialDelaySeconds: 3
      periodSeconds: 5
  dnsPolicy: ClusterFirst
  restartPolicy: Always
